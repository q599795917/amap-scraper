<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高德地图商家采集工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #333; font-size: 26px; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
        .form-item input, .form-item select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-item input:focus { outline: none; border-color: #1890ff; }
        .full-width { grid-column: 1 / -1; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-success { background: #52c41a; color: white; }
        .btn-warning { background: #faad14; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-info { text-align: center; color: #666; margin: 15px 0; font-size: 14px; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .result-table th, .result-table td { border: 1px solid #eee; padding: 8px 10px; text-align: left; }
        .result-table th { background: #fafafa; font-weight: 600; }
        .result-table tr:hover { background: #f5f5f5; }
        .stats { display: flex; justify-content: space-around; margin: 15px 0; padding: 15px; background: #f0f7ff; border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: bold; color: #1890ff; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
        .download-btns { display: flex; gap: 10px; margin-top: 15px; }
        .tips { background: #fffbe6; border: 1px solid #ffe58f; padding: 12px; border-radius: 6px; font-size: 13px; color: #ad6800; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>高德地图商家信息采集工具</h1>
        </div>

        <div class="card">
            <div class="form-grid">
                <div class="form-item full-width">
                    <label>高德API Key（Web服务类型）</label>
                    <input type="text" id="apiKey" placeholder="请输入高德开放平台Web服务Key">
                </div>
                <div class="form-item">
                    <label>省份</label>
                    <select id="province" onchange="onProvinceChange()">
                        <option value="">-- 请选择 --</option>
                        <option value="福建省">福建省</option>
                        <option value="浙江省">浙江省</option>
                        <option value="广东省">广东省</option>
                        <option value="江苏省">江苏省</option>
                        <option value="北京市">北京市</option>
                        <option value="上海市">上海市</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>城市</label>
                    <select id="city" onchange="onCityChange()">
                        <option value="">-- 请选择 --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>区县（可选）</label>
                    <select id="district">
                        <option value="">-- 全部 --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>搜索关键词</label>
                    <input type="text" id="keywords" value="美食" placeholder="如：美食、酒店">
                </div>
                <div class="form-item">
                    <label>最大采集页数</label>
                    <input type="number" id="maxPages" value="20" min="1" max="50">
                </div>
                <div class="form-item">
                    <label>城市限制</label>
                    <select id="citylimit">
                        <option value="true">只搜该城市</option>
                        <option value="false">不限城市</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-primary" id="startBtn" onclick="startSearch()">开始采集</button>
                <button class="btn-warning" id="stopBtn" onclick="stopSearch()" disabled>停止</button>
            </div>

            <div class="progress-info" id="progressInfo">就绪</div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-num" id="totalNum">0</div>
                    <div class="stat-label">总结果数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="collectedNum">0</div>
                    <div class="stat-label">已采集</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="hasPhoneNum">0</div>
                    <div class="stat-label">含电话</div>
                </div>
            </div>

            <div class="download-btns" id="downloadBtns" style="display: none;">
                <button class="btn-success" onclick="downloadExcel()">下载 Excel</button>
                <button class="btn-success" onclick="downloadCSV()">下载 CSV</button>
            </div>

            <div class="tips">
                <strong>使用说明：</strong><br>
                1. 使用Web服务类型的Key，IP白名单请清空<br>
                2. 选择省、市、区县，输入关键词，点击开始采集<br>
                3. 采集完成后点击下载按钮导出结果
            </div>
        </div>

        <div class="card" id="resultCard" style="display: none;">
            <h3 style="margin-bottom: 15px;">采集结果（前50条预览）</h3>
            <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>商家名称</th>
                            <th>地址</th>
                            <th>电话</th>
                            <th>类目</th>
                            <th>区域</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];
        let isRunning = false;

        // 多个CORS代理备用
        const proxies = [
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://thingproxy.freeboard.io/fetch/'
        ];
        let currentProxy = 0;

        // 省市区数据
        const regionData = {
            '福建省': {
                '泉州市': ['鲤城区', '丰泽区', '洛江区', '泉港区', '晋江市', '石狮市', '南安市', '惠安县', '安溪县', '永春县', '德化县'],
                '厦门市': ['思明区', '海沧区', '湖里区', '集美区', '同安区', '翔安区'],
                '福州市': ['鼓楼区', '台江区', '仓山区', '晋安区', '马尾区', '长乐区', '福清市', '闽侯县'],
                '莆田市': ['城厢区', '涵江区', '荔城区', '秀屿区', '仙游县'],
                '漳州市': ['芗城区', '龙文区', '龙海市', '漳浦县', '云霄县', '诏安县', '长泰县']
            },
            '浙江省': {
                '杭州市': ['上城区', '下城区', '江干区', '拱墅区', '西湖区', '滨江区', '萧山区', '余杭区'],
                '宁波市': ['海曙区', '江北区', '北仑区', '镇海区', '鄞州区', '奉化区', '余姚市', '慈溪市'],
                '温州市': ['鹿城区', '龙湾区', '瓯海区', '瑞安市', '乐清市', '永嘉县']
            },
            '广东省': {
                '广州市': ['越秀区', '海珠区', '荔湾区', '天河区', '白云区', '黄埔区', '番禺区', '花都区'],
                '深圳市': ['罗湖区', '福田区', '南山区', '宝安区', '龙岗区', '盐田区', '龙华区', '坪山区']
            }
        };

        function onProvinceChange() {
            const province = document.getElementById('province').value;
            const citySelect = document.getElementById('city');
            const districtSelect = document.getElementById('district');
            
            citySelect.innerHTML = '<option value="">-- 请选择 --</option>';
            districtSelect.innerHTML = '<option value="">-- 全部 --</option>';
            
            if (province && regionData[province]) {
                Object.keys(regionData[province]).forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            }
        }

        function onCityChange() {
            const province = document.getElementById('province').value;
            const city = document.getElementById('city').value;
            const districtSelect = document.getElementById('district');
            
            districtSelect.innerHTML = '<option value="">-- 全部 --</option>';
            
            if (province && city && regionData[province] && regionData[province][city]) {
                regionData[province][city].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
        }

        async function fetchWithProxy(url) {
            for (let i = 0; i < proxies.length; i++) {
                try {
                    const proxyUrl = proxies[i] + encodeURIComponent(url);
                    const response = await fetch(proxyUrl);
                    if (response.ok) {
                        currentProxy = i;
                        return await response.json();
                    }
                } catch (e) {
                    console.log(`代理 ${i} 失败:`, e);
                }
            }
            throw new Error('所有代理都失败了');
        }

        async function startSearch() {
            const key = document.getElementById('apiKey').value.trim();
            const city = document.getElementById('city').value;
            const district = document.getElementById('district').value;
            const keywords = document.getElementById('keywords').value.trim();
            const maxPages = parseInt(document.getElementById('maxPages').value);
            const citylimit = document.getElementById('citylimit').value === 'true';

            if (!key) { alert('请输入API Key'); return; }
            if (!city) { alert('请选择城市'); return; }
            if (!keywords) { alert('请输入搜索关键词'); return; }

            let searchKeywords = keywords;
            if (district) {
                searchKeywords = `${district} ${keywords}`;
            }

            alert('开始采集！\nKey: ' + key + '\n城市: ' + city + '\n关键词: ' + searchKeywords);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            allResults = [];
            isRunning = true;

            try {
                let currentPage = 1;
                let total = 0;

                while (isRunning && currentPage <= maxPages) {
                    document.getElementById('progressInfo').textContent = `正在采集第 ${currentPage} 页...`;

                    const apiUrl = `https://restapi.amap.com/v3/place/text?key=${key}&keywords=${encodeURIComponent(searchKeywords)}&city=${encodeURIComponent(city)}&citylimit=${citylimit}&page_size=20&page_num=${currentPage}&extensions=all`;
                    
                    const data = await fetchWithProxy(apiUrl);

                    if (data.status !== '1') {
                        alert(`API错误: ${data.info} (状态码: ${data.infocode})`);
                        break;
                    }

                    total = data.count;
                    const pois = data.pois || [];

                    alert(`第${currentPage}页成功！共${total}条，本页${pois.length}条`);

                    pois.forEach(poi => {
                        allResults.push({
                            '商家名称': poi.name || '',
                            '地址': poi.address || '',
                            '电话': poi.tel || '',
                            '类目': poi.type || '',
                            '省份': poi.pname || '',
                            '城市': poi.cityname || '',
                            '区域': poi.adname || '',
                            '经度': poi.location ? poi.location.split(',')[0] : '',
                            '纬度': poi.location ? poi.location.split(',')[1] : ''
                        });
                    });

                    updateStats();
                    renderTable();

                    if (allResults.length >= total) break;
                    currentPage++;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                finish();
            } catch (e) {
                alert(`出错了: ${e.message}`);
                finish();
            }
        }

        function stopSearch() {
            isRunning = false;
            document.getElementById('progressInfo').textContent = '已手动停止';
            finish();
        }

        function finish() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('progressInfo').textContent = `采集完成！共 ${allResults.length} 条`;
            document.getElementById('downloadBtns').style.display = 'flex';
            document.getElementById('resultCard').style.display = 'block';
        }

        function updateStats() {
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('totalNum').textContent = allResults.length;
            document.getElementById('collectedNum').textContent = allResults.length;
            const hasPhone = allResults.filter(r => r['电话'] && r['电话'] !== '[]').length;
            document.getElementById('hasPhoneNum').textContent = hasPhone;
        }

        function renderTable() {
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = '';
            allResults.slice(0, 50).forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${item['商家名称']}</td>
                    <td>${item['地址']}</td>
                    <td>${item['电话']}</td>
                    <td>${item['类目']}</td>
                    <td>${item['区域']}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadExcel() {
            const ws = XLSX.utils.json_to_sheet(allResults);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "商家数据");
            const timestamp = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `高德商家_${timestamp}.xlsx`);
        }

        function downloadCSV() {
            const headers = Object.keys(allResults[0]);
            let csv = headers.join(',') + '\n';
            allResults.forEach(row => {
                csv += headers.map(h => `"${(row[h] || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
            });
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `高德商家_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }
    </script>
</body>
</html>
