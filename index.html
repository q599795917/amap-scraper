<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高德商家采集工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #333; font-size: 26px; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
        .form-item input, .form-item select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-item input:focus { outline: none; border-color: #1890ff; }
        .full-width { grid-column: 1 / -1; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-success { background: #52c41a; color: white; }
        .btn-warning { background: #faad14; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-info { text-align: center; color: #666; margin: 15px 0; font-size: 14px; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .result-table th, .result-table td { border: 1px solid #eee; padding: 8px 10px; text-align: left; }
        .result-table th { background: #fafafa; font-weight: 600; }
        .result-table tr:hover { background: #f5f5f5; }
        .stats { display: flex; justify-content: space-around; margin: 15px 0; padding: 15px; background: #f0f7ff; border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: bold; color: #1890ff; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
        .download-btns { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>高德商家采集工具</h1>
        </div>

        <div class="card">
            <div class="form-grid">
                <div class="form-item full-width">
                    <label>API Key</label>
                    <input type="text" id="apiKey" placeholder="请输入你的高德API Key">
                </div>
                <div class="form-item">
                    <label>省份</label>
                    <select id="province" onchange="onProvinceChange()">
                        <option value="">-- 请选择 --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>城市</label>
                    <select id="city" onchange="onCityChange()">
                        <option value="">-- 请选择 --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>区县（可选）</label>
                    <select id="district">
                        <option value="">-- 全部 --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>搜索关键词</label>
                    <input type="text" id="keywords" placeholder="如：美食、酒店">
                </div>
                <div class="form-item">
                    <label>最大采集页数</label>
                    <input type="number" id="maxPages" value="20" min="1" max="50">
                </div>
                <div class="form-item">
                    <label>城市限制</label>
                    <select id="citylimit">
                        <option value="true">只搜该城市</option>
                        <option value="false">不限城市</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-primary" id="startBtn" onclick="startSearch()">开始采集</button>
                <button class="btn-warning" id="stopBtn" onclick="stopSearch()" disabled>停止</button>
            </div>

            <div class="progress-info" id="progressInfo">就绪</div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-num" id="totalNum">0</div>
                    <div class="stat-label">总结果数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="collectedNum">0</div>
                    <div class="stat-label">已采集</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="hasPhoneNum">0</div>
                    <div class="stat-label">含电话</div>
                </div>
            </div>

            <div class="download-btns" id="downloadBtns" style="display: none;">
                <button class="btn-success" onclick="downloadExcel()">下载 Excel</button>
                <button class="btn-success" onclick="downloadCSV()">下载 CSV</button>
            </div>
        </div>

        <div class="card" id="resultCard" style="display: none;">
            <h3 style="margin-bottom: 15px;">采集结果（前50条预览）</h3>
            <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>商家名称</th>
                            <th>地址</th>
                            <th>电话</th>
                            <th>类目</th>
                            <th>区域</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];
        let isRunning = false;
        let callbackIndex = 0;
        let seenIds = new Set();

        window.onload = function() {
            const savedKey = localStorage.getItem('amap_key');
            const savedKeywords = localStorage.getItem('amap_keywords');
            const savedMaxPages = localStorage.getItem('amap_maxPages');
            const savedCitylimit = localStorage.getItem('amap_citylimit');
            
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            if (savedKeywords) document.getElementById('keywords').value = savedKeywords;
            if (savedMaxPages) document.getElementById('maxPages').value = savedMaxPages;
            if (savedCitylimit) document.getElementById('citylimit').value = savedCitylimit;
            
            if (savedKey) {
                document.getElementById('apiKey').dispatchEvent(new Event('blur'));
            }
        };

        function saveSettings() {
            localStorage.setItem('amap_key', document.getElementById('apiKey').value.trim());
            localStorage.setItem('amap_keywords', document.getElementById('keywords').value.trim());
            localStorage.setItem('amap_maxPages', document.getElementById('maxPages').value);
            localStorage.setItem('amap_citylimit', document.getElementById('citylimit').value);
        }

        function jsonpRequest(url) {
            return new Promise((resolve, reject) => {
                const callbackName = 'amapCallback' + (callbackIndex++);
                window[callbackName] = (data) => {
                    resolve(data);
                    delete window[callbackName];
                    document.body.removeChild(script);
                };
                const script = document.createElement('script');
                script.src = url + '&callback=' + callbackName;
                script.onerror = () => {
                    reject(new Error('请求失败'));
                    document.body.removeChild(script);
                };
                document.body.appendChild(script);
            });
        }

        document.getElementById('apiKey').addEventListener('blur', async function() {
            const key = this.value.trim();
            if (!key) return;
            try {
                const provinceData = await jsonpRequest(`https://restapi.amap.com/v3/config/district?key=${key}&keywords=中国&subdistrict=1`);
                const provinceList = provinceData.districts[0].districts;
                const provinceSelect = document.getElementById('province');
                provinceSelect.innerHTML = '<option value="">-- 请选择 --</option>';
                provinceList.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.name;
                    option.textContent = p.name;
                    provinceSelect.appendChild(option);
                });
            } catch (e) {
            }
        });

        async function onProvinceChange() {
            const provinceName = document.getElementById('province').value;
            const citySelect = document.getElementById('city');
            const districtSelect = document.getElementById('district');
            
            citySelect.innerHTML = '<option value="">-- 请选择 --</option>';
            districtSelect.innerHTML = '<option value="">-- 全部 --</option>';

            if (!provinceName) return;

            const key = document.getElementById('apiKey').value.trim();
            try {
                const cityData = await jsonpRequest(`https://restapi.amap.com/v3/config/district?key=${key}&keywords=${encodeURIComponent(provinceName)}&subdistrict=1`);
                const cityList = cityData.districts[0].districts;
                cityList.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.name;
                    option.textContent = c.name;
                    citySelect.appendChild(option);
                });
            } catch (e) {
                alert('加载城市失败');
            }
        }

        async function onCityChange() {
            const cityName = document.getElementById('city').value;
            const districtSelect = document.getElementById('district');
            
            districtSelect.innerHTML = '<option value="">-- 全部 --</option>';

            if (!cityName) return;

            const key = document.getElementById('apiKey').value.trim();
            try {
                const districtData = await jsonpRequest(`https://restapi.amap.com/v3/config/district?key=${key}&keywords=${encodeURIComponent(cityName)}&subdistrict=1`);
                const districtList = districtData.districts[0].districts;
                districtList.forEach(d => {
                    const option = document.createElement('option');
                    option.value = d.name;
                    option.textContent = d.name;
                    districtSelect.appendChild(option);
                });
            } catch (e) {
                alert('加载区县失败');
            }
        }

        async function startSearch() {
            const key = document.getElementById('apiKey').value.trim();
            const city = document.getElementById('city').value;
            const district = document.getElementById('district').value;
            const keywords = document.getElementById('keywords').value.trim();
            const maxPages = parseInt(document.getElementById('maxPages').value);
            const citylimit = document.getElementById('citylimit').value === 'true';

            if (!key) { alert('请输入API Key'); return; }
            if (!city) { alert('请选择城市'); return; }
            if (!keywords) { alert('请输入搜索关键词'); return; }

            saveSettings();

            let searchKeywords = keywords;
            if (district) {
                searchKeywords = `${district} ${keywords}`;
            }

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            allResults = [];
            seenIds = new Set();
            isRunning = true;

            try {
                let currentPage = 1;
                let total = 0;

                while (isRunning && currentPage <= maxPages) {
                    document.getElementById('progressInfo').textContent = `正在采集第 ${currentPage} 页...`;

                    const apiUrl = `https://restapi.amap.com/v3/place/text?key=${key}&keywords=${encodeURIComponent(searchKeywords)}&city=${encodeURIComponent(city)}&citylimit=${citylimit}&page_size=20&page_num=${currentPage - 1}&extensions=all`;
                    
                    const data = await jsonpRequest(apiUrl);

                    if (data.status !== '1') {
                        alert(`错误: ${data.info}`);
                        break;
                    }

                    total = data.count;
                    const pois = data.pois || [];

                    pois.forEach(poi => {
                        if (poi.id && seenIds.has(poi.id)) return;
                        if (poi.id) seenIds.add(poi.id);

                        allResults.push({
                            '商家名称': poi.name || '',
                            '地址': poi.address || '',
                            '电话': poi.tel || '',
                            '类目': poi.type || '',
                            '省份': poi.pname || '',
                            '城市': poi.cityname || '',
                            '区域': poi.adname || '',
                            '经度': poi.location ? poi.location.split(',')[0] : '',
                            '纬度': poi.location ? poi.location.split(',')[1] : ''
                        });
                    });

                    updateStats();
                    renderTable();

                    if (allResults.length >= total || pois.length === 0) break;
                    currentPage++;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                finish();
            } catch (e) {
                alert(`出错了: ${e.message}`);
                finish();
            }
        }

        function stopSearch() {
            isRunning = false;
            document.getElementById('progressInfo').textContent = '已手动停止';
            finish();
        }

        function finish() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('progressInfo').textContent = `采集完成！共 ${allResults.length} 条`;
            document.getElementById('downloadBtns').style.display = 'flex';
            document.getElementById('resultCard').style.display = 'block';
        }

        function updateStats() {
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('totalNum').textContent = allResults.length;
            document.getElementById('collectedNum').textContent = allResults.length;
            const hasPhone = allResults.filter(r => r['电话'] && r['电话'] !== '[]').length;
            document.getElementById('hasPhoneNum').textContent = hasPhone;
        }

        function renderTable() {
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = '';
            allResults.slice(0, 50).forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${item['商家名称']}</td>
                    <td>${item['地址']}</td>
                    <td>${item['电话']}</td>
                    <td>${item['类目']}</td>
                    <td>${item['区域']}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadExcel() {
            const ws = XLSX.utils.json_to_sheet(allResults);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "商家数据");
            const timestamp = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `高德商家_${timestamp}.xlsx`);
        }

        function downloadCSV() {
            const headers = Object.keys(allResults[0]);
            let csv = headers.join(',') + '\n';
            allResults.forEach(row => {
                csv += headers.map(h => `"${(row[h] || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
            });
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `高德商家_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }
    </script>
</body>
</html>
