<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高德商家采集工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
        --bg:#0b1120; --bg2:#0f1a30; --card:#111c33; --border:#1f2c4a;
        --txt:#e6edf7; --sub:#8b9bb8; --accent:#3b82f6; --accent2:#22d3ee;
        --ok:#34d399; --err:#f87171;
    }
    body{font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;color:var(--txt);
        background:radial-gradient(1200px 600px at 70% -10%,#1b2a52 0%,var(--bg) 55%) fixed;}
    #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
    .gate-card{width:100%;max-width:400px;background:rgba(17,28,51,.85);backdrop-filter:blur(12px);
        border:1px solid var(--border);border-radius:18px;padding:38px 32px;
        box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(59,130,246,.15) inset;}
    .gate-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;font-size:28px;}
    .gate-card h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:1px}
    .gate-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:28px}
    .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
    .field input{width:100%;padding:13px 14px;background:#0b1428;border:1px solid var(--border);
        border-radius:10px;color:var(--txt);font-size:15px;letter-spacing:2px;outline:none;transition:.2s}
    .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
    .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;
        cursor:pointer;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;transition:.2s}
    .btn:hover{filter:brightness(1.1)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .gate-status{min-height:20px;margin-top:14px;font-size:13px;text-align:center}
    .gate-status.err{color:var(--err)} .gate-status.ok{color:var(--ok)}
    .gate-foot{margin-top:18px;text-align:center;font-size:12px;color:#5a6b8c}
    #main{display:none;max-width:1080px;margin:0 auto;padding:20px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .dot{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;font-size:20px}
    .brand h1{font-size:19px}
    .lic-chip{font-size:12px;color:var(--sub);background:#0b1428;border:1px solid var(--border);
        padding:6px 12px;border-radius:20px;display:flex;gap:8px;align-items:center}
    .lic-chip b{color:var(--ok)}
    .card{background:rgba(17,28,51,.85);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px}
    .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
    .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;background:#0b1428;border:1px solid var(--border);
        border-radius:8px;color:var(--txt);font-size:14px;outline:none;font-family:inherit;transition:.2s}
    .field textarea{resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
    .key-row{display:flex;gap:8px}
    .key-row input{flex:1}
    .mini-btn{padding:10px 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);
        border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
    .mini-btn:hover{background:rgba(59,130,246,.12)}
    .hint{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
    .hint.ok{color:var(--ok)} .hint.err{color:var(--err)}
    .key-help{margin-top:10px;font-size:12px;color:#5a6b8c;line-height:1.8}
    .key-help a{color:var(--accent2);text-decoration:none}
    .key-help summary{cursor:pointer;color:var(--accent2)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip{background:rgba(59,130,246,.15);border:1px solid #2b4a7a;color:#9ec1ff;
        padding:4px 10px;border-radius:14px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
    .chip .x{cursor:pointer;color:var(--err);font-weight:bold}
    .add-btn{padding:7px 14px;background:transparent;border:1px dashed #2b4a7a;color:#9ec1ff;border-radius:8px;cursor:pointer;font-size:13px}
    .add-btn:hover{background:rgba(59,130,246,.1)}
    .actions{display:flex;gap:10px;margin-top:6px}
    .big{flex:1;padding:14px;font-size:15px}
    .stop{background:#3a2330;border:none;color:#fca5a5}
    .stop:disabled{opacity:.4}
    .prog{text-align:center;color:var(--sub);font-size:13px;margin:14px 0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
    .stat{background:#0b1428;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
    .stat .n{font-size:24px;font-weight:700;color:var(--accent2)}
    .stat .l{font-size:12px;color:var(--sub);margin-top:4px}
    .dl{display:flex;gap:10px}
    .dl button{flex:1;padding:11px;background:linear-gradient(135deg,#059669,#10b981);border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:14px}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th,td{border-bottom:1px solid #1a2540;padding:8px 10px;text-align:left;white-space:nowrap}
    th{color:var(--sub);font-weight:600;background:#0b1428;position:sticky;top:0}
    .tbl-wrap{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:8px}
    h3{font-size:15px;margin-bottom:12px}
</style>
</head>
<body>

<div id="gate">
    <div class="gate-card">
        <div class="gate-logo">📍</div>
        <h1>高德商家采集工具</h1>
        <div class="gate-sub">请输入卡密激活后使用</div>
        <div class="field">
            <label>卡密</label>
            <input id="cardInput" type="text" placeholder="XXXXXXXXXXXXX" autocomplete="off">
        </div>
        <div style="height:14px"></div>
        <button class="btn" id="gateBtn" onclick="doLogin()">激 活 进 入</button>
        <div class="gate-status" id="gateStatus"></div>
        <div class="gate-foot">卡密请联系作者购买</div>
    </div>
</div>

<div id="main">
    <div class="topbar">
        <div class="brand">
            <div class="dot">📍</div>
            <h1>高德商家采集工具</h1>
        </div>
        <div class="lic-chip" id="licChip"></div>
    </div>

    <div class="card">
        <div class="row">
            <div class="field" style="grid-column:1/-1">
                <label>API Key（多个 Key 每行一个，自动轮换抗限流）</label>
                <div class="key-row">
                    <textarea id="apiKey" rows="2" placeholder="高德 Web 服务 Key&#10;多个 Key 每行一个"></textarea>
                    <button class="mini-btn" onclick="loadProvinces()">加载地区</button>
                </div>
                <div class="hint" id="regionHint">输入 Key 后点「加载地区」</div>
                <div class="key-help">
                    没有 Key？<a href="https://console.amap.com/dev/key/app" target="_blank" rel="noopener">去高德开放平台申请</a>
                    <details><summary>创建步骤</summary>
                        1. 登录高德开放平台 → 控制台 → 应用管理 → 创建应用<br>
                        2. 添加 Key，服务平台选「Web服务」，IP 白名单留空<br>
                        3. 复制 Key 粘贴到上面
                    </details>
                </div>
            </div>
            <div class="field"><label>省份</label><select id="province" onchange="onProvinceChange()"><option value="">-- 先加载地区 --</option></select></div>
            <div class="field"><label>城市</label><select id="city" onchange="onCityChange()"><option value="">-- 先选省 --</option></select></div>
            <div class="field"><label>区县（可选）</label><select id="district"><option value="">-- 全部 --</option></select></div>
            <div class="field" style="grid-column:1/-1">
                <button class="add-btn" onclick="addRegion()">＋ 加入采集地区</button>
                <div class="chips" id="regionChips"></div>
                <div class="hint" id="regionEmpty">未添加地区时，将使用上面当前选中的省/市/区</div>
            </div>
            <div class="field" style="grid-column:1/-1">
                <label>搜索关键词（每行一个，支持多个）</label>
                <textarea id="keywords" rows="3" placeholder="美食&#10;酒店&#10;KTV"></textarea>
            </div>
            <div class="field"><label>每个关键词最大页数</label><input type="number" id="maxPages" value="20" min="1" max="50"></div>
            <div class="field"><label>城市限制</label>
                <select id="citylimit"><option value="true">只搜该城市</option><option value="false">不限城市</option></select>
            </div>
        </div>
        <div class="actions">
            <button class="btn big" id="startBtn" onclick="startSearch()">开始采集</button>
            <button class="btn big stop" id="stopBtn" onclick="stopSearch()" disabled>停止</button>
        </div>
        <div class="prog" id="progressInfo">就绪</div>
        <div class="stats" id="stats" style="display:none">
            <div class="stat"><div class="n" id="totalNum">0</div><div class="l">总结果</div></div>
            <div class="stat"><div class="n" id="collectedNum">0</div><div class="l">已采集</div></div>
            <div class="stat"><div class="n" id="hasPhoneNum">0</div><div class="l">含电话</div></div>
        </div>
        <div class="dl" id="dlBtns" style="display:none">
            <button onclick="dedupResults()">结果去重</button>
            <button onclick="downloadExcel()">下载 Excel</button>
            <button onclick="downloadCSV()">下载 CSV</button>
        </div>
    </div>

    <div class="card" id="resultCard" style="display:none">
        <h3>采集结果（前 50 条预览）</h3>
        <div class="tbl-wrap">
        <table>
            <thead><tr><th>#</th><th>商家名称</th><th>地址</th><th>电话</th><th>类目</th><th>区域</th><th>关键词</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
        </div>
    </div>
</div>

<script>
const AUTH_API = "https://newspapers-speeds-selections-cir.trycloudflare.com/web/verify";
let allResults=[], isRunning=false, callbackIndex=0, seenIds=new Set(), selectedRegions=[];
let keyIdx=0;
function getKeys(){
    return document.getElementById("apiKey").value.split(/[\n,，;；\s]+/).map(s=>s.trim()).filter(Boolean);
}

function machineId(){
    let m = localStorage.getItem("amap_mid");
    if(!m){ m = "WEB-" + (crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):"xxxxxxxx").toUpperCase().slice(0,24);
            localStorage.setItem("amap_mid", m); }
    return m;
}

async function doLogin(){
    const card = document.getElementById("cardInput").value.trim().toUpperCase();
    const st = document.getElementById("gateStatus");
    const btn = document.getElementById("gateBtn");
    if(!card){ st.className="gate-status err"; st.textContent="请输入卡密"; return; }
    btn.disabled = true; st.className="gate-status"; st.textContent="正在验证...";
    try{
        const r = await fetch(AUTH_API,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({card, machine:machineId()})});
        const j = await r.json();
        if(j.ok){
            localStorage.setItem("amap_card", card);
            enterMain(j);
        }else{
            st.className="gate-status err"; st.textContent = j.reason || "卡密无效";
        }
    }catch(e){
        st.className="gate-status err"; st.textContent="网络异常，无法连接授权服务器";
    }finally{ btn.disabled = false; }
}

function fmtRemain(ms){
    const d = Math.floor(ms/86400000);
    if(d >= 365) return "长期有效";
    if(d >= 1) return "剩余 " + d + " 天";
    return "剩余不足 1 天";
}

function enterMain(j){
    document.getElementById("gate").style.display="none";
    document.getElementById("main").style.display="block";
    const chip = document.getElementById("licChip");
    chip.innerHTML = "授权：<b>"+(j.type_name||"已激活")+"</b> · "+fmtRemain(j.remaining_ms||0);
    restoreSettings();
}

window.onload = function(){
    const saved = localStorage.getItem("amap_card");
    if(saved){
        document.getElementById("cardInput").value = saved;
        doLogin();
    }
};

function restoreSettings(){
    const k=localStorage.getItem("amap_key"), kw=localStorage.getItem("amap_keywords"),
          mp=localStorage.getItem("amap_maxPages"), cl=localStorage.getItem("amap_citylimit");
    if(k) document.getElementById("apiKey").value=k;
    if(kw) document.getElementById("keywords").value=kw;
    if(mp) document.getElementById("maxPages").value=mp;
    if(cl) document.getElementById("citylimit").value=cl;
    if(k) loadProvinces();
}
function saveSettings(){
    localStorage.setItem("amap_key", document.getElementById("apiKey").value.trim());
    localStorage.setItem("amap_keywords", document.getElementById("keywords").value.trim());
    localStorage.setItem("amap_maxPages", document.getElementById("maxPages").value);
    localStorage.setItem("amap_citylimit", document.getElementById("citylimit").value);
}

function jsonpRequest(url){
    return new Promise((resolve,reject)=>{
        const cb="amapCb"+(callbackIndex++), sc=document.createElement("script");
        let done=false;
        const cl=()=>{delete window[cb]; sc.parentNode&&sc.parentNode.removeChild(sc);};
        const t=setTimeout(()=>{if(done)return;done=true;cl();reject(new Error("请求超时"));},12000);
        window[cb]=(d)=>{if(done)return;done=true;clearTimeout(t);cl();resolve(d);};
        sc.src=url+"&callback="+cb;
        sc.onerror=()=>{if(done)return;done=true;clearTimeout(t);cl();reject(new Error("网络错误"));};
        document.body.appendChild(sc);
    });
}

function fillSel(id,items,ph){
    const el=document.getElementById(id); el.innerHTML="";
    const f=document.createElement("option"); f.value=""; f.textContent=ph; el.appendChild(f);
    items.forEach(it=>{const o=document.createElement("option");o.value=it.name;o.textContent=it.name;el.appendChild(o);});
}
function setHint(t,cls){const e=document.getElementById("regionHint");e.textContent=t;e.className="hint"+(cls?" "+cls:"");}

async function loadProvinces(){
    const keys=getKeys();
    if(!keys.length){setHint("请先输入 API Key","err");return;}
    const key=keys[0];
    setHint("正在加载省份...");
    try{
        const d=await jsonpRequest("https://restapi.amap.com/v3/config/district?key="+key+"&keywords="+encodeURIComponent("中国")+"&subdistrict=1");
        if(d.status!=="1"){setHint("加载失败："+d.info+"（"+d.infocode+"）","err");return;}
        const ps=(d.districts&&d.districts[0]&&d.districts[0].districts)||[];
        fillSel("province",ps,"-- 请选择省份 --");
        fillSel("city",[],"-- 先选省 --"); fillSel("district",[],"-- 全部 --");
        setHint("已加载 "+ps.length+" 个省份（共 "+keys.length+" 个 Key）","ok"); saveSettings();
    }catch(e){setHint("加载失败："+e.message,"err");}
}
async function onProvinceChange(){
    const pn=document.getElementById("province").value, keys=getKeys();
    fillSel("city",[],"-- 先省 --"); fillSel("district",[],"-- 全部 --");
    if(!pn||!keys.length)return;
    setHint("加载 "+pn+" 城市...");
    try{
        const d=await jsonpRequest("https://restapi.amap.com/v3/config/district?key="+keys[0]+"&keywords="+encodeURIComponent(pn)+"&subdistrict=1");
        const cs=(d.districts&&d.districts[0]&&d.districts[0].districts)||[];
        fillSel("city",cs,"-- 请选择城市 --"); setHint("已加载 "+cs.length+" 个城市","ok");
    }catch(e){setHint("加载城市失败","err");}
}
async function onCityChange(){
    const cn=document.getElementById("city").value, keys=getKeys();
    fillSel("district",[],"-- 全部 --");
    if(!cn||!keys.length)return;
    setHint("加载 "+cn+" 区县...");
    try{
        const d=await jsonpRequest("https://restapi.amap.com/v3/config/district?key="+keys[0]+"&keywords="+encodeURIComponent(cn)+"&subdistrict=1");
        const ds=(d.districts&&d.districts[0]&&d.districts[0].districts)||[];
        fillSel("district",ds,"-- 全部 --"); setHint("已加载 "+ds.length+" 个区县","ok");
    }catch(e){setHint("加载区县失败","err");}
}

function regionLabel(r){return (r.province||"")+(r.city||"")+(r.district||"");}
function renderChips(){
    const box=document.getElementById("regionChips"), empty=document.getElementById("regionEmpty");
    box.innerHTML="";
    selectedRegions.forEach((r,i)=>{
        const c=document.createElement("span"); c.className="chip"; c.textContent=regionLabel(r);
        const x=document.createElement("span"); x.className="x"; x.textContent="×";
        x.onclick=()=>{selectedRegions.splice(i,1);renderChips();};
        c.appendChild(x); box.appendChild(c);
    });
    empty.style.display = selectedRegions.length?"none":"block";
}
function addRegion(){
    const p=document.getElementById("province").value, c=document.getElementById("city").value, d=document.getElementById("district").value;
    if(!p||!c){alert("请先选择省和城市");return;}
    if(selectedRegions.some(r=>r.province===p&&r.city===c&&r.district===d)){alert("该地区已在列表");return;}
    selectedRegions.push({province:p,city:c,district:d}); renderChips();
}

async function fetchPage(baseUrl, keys){
    const n=keys.length, attempts=n*2;
    for(let i=0;i<attempts && isRunning;i++){
        const key=keys[keyIdx % n]; keyIdx++;
        try{
            const d=await jsonpRequest(baseUrl+"&key="+key);
            if(d.status==="1") return d;
            await new Promise(r=>setTimeout(r,1200));
        }catch(e){
            await new Promise(r=>setTimeout(r,1200));
        }
    }
    return null;
}

async function collectOne(keys,city,district,kw,maxPages,citylimit){
    let sk=kw; if(district) sk=district+" "+kw;
    for(let page=1; page<=maxPages && isRunning; page++){
        document.getElementById("progressInfo").textContent=city+"｜"+kw+"：第 "+page+" 页（累计 "+allResults.length+" 条）";
        const base="https://restapi.amap.com/v3/place/text?keywords="+encodeURIComponent(sk)+
            "&city="+encodeURIComponent(city)+"&citylimit="+citylimit+"&page_size=20&page_num="+(page-1)+"&extensions=all";
        const d=await fetchPage(base, keys);
        if(!d){ document.getElementById("progressInfo").textContent+="（此关键词接口失败，跳过）"; break; }
        (d.pois||[]).forEach(poi=>{
            if(typeof poi==="string")return;
            if(poi.id && seenIds.has(poi.id))return;
            if(poi.id) seenIds.add(poi.id);
            allResults.push({"商家名称":poi.name||"","地址":poi.address||"","电话":poi.tel||"","类目":poi.type||"",
                "省份":poi.pname||"","城市":poi.cityname||"","区域":poi.adname||"","关键词":kw,
                "经度":poi.location?poi.location.split(",")[0]:"","纬度":poi.location?poi.location.split(",")[1]:""});
        });
        updateStats(); renderTable();
        if(!(d.pois||[]).length) break;
        await new Promise(r=>setTimeout(r,600));
    }
}
async function startSearch(){
    const keys=getKeys();
    const kwRaw=document.getElementById("keywords").value.trim();
    const maxPages=parseInt(document.getElementById("maxPages").value,10);
    const cl=document.getElementById("citylimit").value;
    if(!keys.length){alert("请输入 API Key");return;}
    if(!kwRaw){alert("请输入关键词");return;}
    const kws=kwRaw.split(/[\n,，、;；]+/).map(s=>s.trim()).filter(Boolean);
    let regions=selectedRegions.slice();
    if(!regions.length){
        const p=document.getElementById("province").value,c=document.getElementById("city").value,d=document.getElementById("district").value;
        if(!p||!c){alert("请先选省/市，或加入采集地区");return;}
        regions=[{province:p,city:c,district:d}];
    }
    saveSettings();
    regions = regions.filter(r => r.city && !r.city.startsWith("--"));
    if(!regions.length){
        alert("请先选省/市，或加入采集地区");
        document.getElementById("startBtn").disabled=false;
        return;
    }
    document.getElementById("startBtn").disabled=true;
    document.getElementById("stopBtn").disabled=false;
    allResults=[]; seenIds=new Set(); isRunning=true; keyIdx=0;
    const total=regions.length*kws.length; let idx=0;
    try{
        for(const r of regions){ if(!isRunning)break;
            for(const kw of kws){ if(!isRunning)break; idx++;
                document.getElementById("progressInfo").textContent="任务 "+idx+"/"+total+"："+r.city+"｜"+kw;
                await collectOne(keys,r.city,r.district,kw,maxPages,cl);
            }
        }
    }finally{ finish(); }
}
function stopSearch(){isRunning=false; finish();}
function finish(){
    isRunning=false;
    document.getElementById("startBtn").disabled=false;
    document.getElementById("stopBtn").disabled=true;
    const hp=allResults.filter(r=>r["电话"]&&r["电话"]!=="[]").length;
    document.getElementById("progressInfo").textContent="采集完成！共 "+allResults.length+" 条（含电话 "+hp+" 条）";
    document.getElementById("dlBtns").style.display="flex";
    document.getElementById("resultCard").style.display="block";
}
function updateStats(){
    document.getElementById("stats").style.display="grid";
    document.getElementById("totalNum").textContent=allResults.length;
    document.getElementById("collectedNum").textContent=allResults.length;
    document.getElementById("hasPhoneNum").textContent=allResults.filter(r=>r["电话"]&&r["电话"]!=="[]").length;
}
function dedupResults(){
    if(!allResults.length) return;
    const seen=new Set(), out=[];
    allResults.forEach(r=>{
        const key=(r["商家名称"]||"").trim()+"|"+(r["地址"]||"").trim();
        if(seen.has(key)) return;
        seen.add(key); out.push(r);
    });
    const n=allResults.length-out.length;
    allResults=out;
    updateStats(); renderTable();
    document.getElementById("progressInfo").textContent="已去重，移除 "+n+" 条重复，剩余 "+allResults.length+" 条";
}
function renderTable(){
    const tb=document.getElementById("resultBody"); tb.innerHTML="";
    allResults.slice(0,50).forEach((it,i)=>{
        const tr=document.createElement("tr");
        [i+1,it["商家名称"],it["地址"],it["电话"],it["类目"],it["区域"],it["关键词"]].forEach(v=>{
            const td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
        });
        tb.appendChild(tr);
    });
}
function sheetNameSafe(s){
    return (s||"未分类").replace(/[\\\/\?\*\[\]:]/g,"_").slice(0,28)||"未分类";
}
function downloadExcel(){
    const wb=XLSX.utils.book_new();
    const groups={};
    allResults.forEach(r=>{
        const key=(r["城市"]||"")+(r["区域"]?("-"+r["区域"]):"")+"|"+(r["关键词"]||"");
        (groups[key]=groups[key]||[]).push(r);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allResults), "全部汇总");
    Object.keys(groups).sort().forEach(key=>{
        const ws=XLSX.utils.json_to_sheet(groups[key]);
        XLSX.utils.book_append_sheet(wb, ws, sheetNameSafe(key));
    });
    XLSX.writeFile(wb,"高德商家_"+new Date().toISOString().slice(0,10)+".xlsx");
}
function downloadCSV(){
    const h=Object.keys(allResults[0]);
    const sorted=allResults.slice().sort((a,b)=>((a["城市"]||"")+(a["区域"]||"")+(a["关键词"]||"")).localeCompare((b["城市"]||"")+(b["区域"]||"")+(b["关键词"]||""),"zh"));
    let csv=h.join(",")+"\n";
    sorted.forEach(r=>{csv+=h.map(k=>'"'+String(r[k]||"").replace(/"/g,'""')+'"').join(",")+"\n";});
    const b=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="高德商家_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
}
</script>
